# Add inside your server { } block.
# "/" already serves index.html via the default "index index.html;" directive.

location = /all-projects {
    try_files /All_projects.html =404;
}

# Serve Projects.html (the shared project-detail template) for any
# /project/<slug> URL - direct visits and refreshes included.
location ~ ^/project/[^/]+/?$ {
    try_files /Projects.html =404;
}
