<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  try{
    var saved = localStorage.getItem('mtv-theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if(theme === 'light'){ document.documentElement.setAttribute('data-theme','light'); }
  }catch(e){}
})();
</script>
<title>Project — Maveric Viernes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0d0e;
    --bone:#ece6d9;
    --bone-dim:#a9a297;
    --gold:#c9a227;
    --gold-dim:#8a7220;
    --dash-yellow:#f0c419;
    --line:#2a2a28;
    --ink-rgb:12,13,14;
    --bone-rgb:236,230,217;
    --gold-rgb:201,162,39;
    --ff-display:'Clash Display', 'Anton', sans-serif;
    --ff-body:'Clash Display', 'Space Grotesk', sans-serif;
    --ff-mono:'Space Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:auto;}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:var(--ff-body);
    overflow-x:hidden;
    position:relative;
  }
  /* Subtle layered depth behind all content — soft, low-opacity glows
     plus a faint grain, fixed so it doesn't move or reflow anything.
     Kept dark and low-contrast so body copy stays fully readable. */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 38% at 12% 4%, rgba(201,162,39,0.075), transparent 62%),
      radial-gradient(ellipse 50% 42% at 96% 22%, rgba(236,230,217,0.05), transparent 60%),
      radial-gradient(ellipse 60% 46% at 22% 62%, rgba(201,162,39,0.05), transparent 65%),
      radial-gradient(ellipse 65% 50% at 88% 96%, rgba(201,162,39,0.045), transparent 65%),
      var(--ink);
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    opacity:0.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
    mix-blend-mode:overlay;
  }
  ::selection{background:var(--gold);color:var(--ink);}
  a{color:inherit;}

  /* ---------- SMOOTH SCROLL WRAPPER ----------
     The real page scroll happens against #scroll-spacer (a plain block
     matching #smooth-content's height); #smooth-content itself is
     fixed and its position is lerped toward that real scroll value
     each frame, producing the slow, fluid easing feel. Native
     scrollbar, trackpad, and keyboard scrolling all keep working
     exactly as before — only the visual motion is smoothed. */
  #smooth-content{
    position:fixed;
    top:0;left:0;
    width:100%;
    will-change:transform;
  }
  /* Mobile: disable the lerp-smoothed scroll wrapper entirely so
     scrolling is native/instant, like normal phone scrolling.
     #smooth-content flows normally in the document instead of being
     fixed+transformed, and the spacer (only needed to hold scroll
     height for the fixed layer) is collapsed. Desktop is untouched. */
  @media (max-width:768px){
    #smooth-content{
      position:static;
      width:auto;
      will-change:auto;
      transform:none !important;
    }
    #scroll-spacer{
      display:none;
    }
  }

  /* ---------- PAGE TRANSITION ----------
     Covers the viewport on arrival and fades away, mirroring the
     overlay the homepage fades IN before sending you here — so the
     hand-off between the two pages reads as one continuous motion. */
  #page-transition{
    position:fixed;inset:0;
    z-index:998;
    background:var(--ink);
    opacity:1;
    pointer-events:none;
    transition:opacity 0.6s cubic-bezier(.65,0,.35,1);
  }
  #page-transition.cleared{opacity:0;}
  @media (prefers-reduced-motion:reduce){
    #page-transition{transition:none;}
  }

  /* ---------- NAV (identical treatment to the homepage, content
     constrained to an 80rem column so it doesn't stretch edge to
     edge on wide screens) ---------- */
  #nav{
    position:fixed;
    top:0;left:0;right:0;
    z-index:50;
    background:rgba(var(--ink-rgb),0.55);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid rgba(var(--bone-rgb),0.08);
  }
  /* Light/dark tokens — same mechanism as Untitled 2: redefining these
     root custom properties re-themes every element that reads var(--ink)/
     var(--bone)/var(--gold)/etc. across the whole page, not just the nav. */
  html[data-theme="light"]{
    --ink:#ffffff;
    --bone:#111111;
    --bone-dim:#6e6e6e;
    --gold:#d4a017;
    --gold-dim:#a97e10;
    --line:#e2e2e2;
    --ink-rgb:255,255,255;
    --bone-rgb:17,17,17;
    --gold-rgb:212,160,23;
  }
  /* Project images (hero cover photo + case-study gallery) are excluded
     from Light Mode — same treatment Untitled 2 gives its own hero video.
     Re-pinning the tokens to their dark values on these two subtrees means
     every image, overlay, icon, and piece of overlaid text inside them
     keeps rendering exactly as it does in Dark Mode, no matter the theme. */
  html[data-theme="light"] #detail-hero{
    --ink:#0c0d0e;
    --bone:#ece6d9;
    --bone-dim:#a9a297;
    --gold:#c9a227;
    --gold-dim:#8a7220;
    --line:#2a2a28;
    --ink-rgb:12,13,14;
    --bone-rgb:236,230,217;
    --gold-rgb:201,162,39;
  }
  html[data-theme="light"] #gallery{
    --ink:#0c0d0e;
    --bone:#ece6d9;
    --bone-dim:#a9a297;
    --gold:#c9a227;
    --gold-dim:#8a7220;
    --line:#2a2a28;
    --ink-rgb:12,13,14;
    --bone-rgb:236,230,217;
    --gold-rgb:201,162,39;
  }
  .nav-inner{
    max-width:80rem;
    margin:0 auto;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:0.80rem clamp(1.2rem,4vw,3rem);
  }
  .nav-logo{
    grid-column:1;
    justify-self:start;
    font-family:var(--ff-display);
    font-weight:700;
    font-size:1.3rem;
    letter-spacing:0.1em;
    color:var(--gold);
    text-decoration:none;
  }
  .nav-links{
    grid-column:2;
    display:flex;
    align-items:center;
    gap:clamp(1.3rem,2.6vw,2.2rem);
    font-family:var(--ff-body);
    font-weight:500;
    font-size:0.68rem;
    letter-spacing:0.16em;
  }
  .nav-links a{
    color:var(--bone);
    text-decoration:none;
    opacity:0.8;
    text-transform:uppercase;
    transition:opacity 0.25s;
  }
  .nav-links a:hover{opacity:1;}

  .nav-right{
    grid-column:3;
    justify-self:end;
    display:flex;
    align-items:center;
    gap:0.9rem;
  }
  .theme-toggle{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--bone);
    cursor:pointer;
    transition:border-color 0.25s, transform 0.25s, background 0.25s;
    flex-shrink:0;
  }
  .theme-toggle:hover{
    border-color:var(--gold-dim);
    transform:rotate(12deg);
  }
  .theme-toggle svg{
    width:16px;
    height:16px;
    stroke:currentColor;
  }
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="light"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="light"] .theme-toggle .icon-moon{display:block;}

  .nav-cta{
    display:inline-flex;
    align-items:center;
    gap:0.45rem;
    font-family:"Clash Display", var(--ff-display), sans-serif;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.02em;
    color:#111111;
    background:var(--gold);
    border:1px solid var(--gold);
    border-radius:999px;
    padding:0.55rem 1.1rem;
    text-decoration:none;
    white-space:nowrap;
    cursor:pointer;
    box-shadow:0 0 14px rgba(var(--gold-rgb),0.4), 0 0 3px rgba(var(--gold-rgb),0.25);
    transition:background 0.25s, filter 0.25s, transform 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .nav-cta svg{width:15px;height:15px;flex-shrink:0;}
  .nav-cta:hover{
    filter:brightness(1.06) saturate(1.15);
    box-shadow:0 0 4px rgba(var(--gold-rgb),0.15);
    transform:translateY(-1px);
  }
  /* Back button now lives inside the hero (top-left), not in the nav
     bar — kept visually subtle (blurred dark chip) but always legible
     over the image, regardless of what's behind it. */
  .hero-back{
    position:absolute;
    top:clamp(5.4rem,10vw,6.6rem);
    left:clamp(1.2rem,4vw,3rem);
    z-index:3;
    display:flex;
    align-items:center;
    gap:0.5rem;
    padding:0.55rem 1rem 0.55rem 0.8rem;
    border-radius:999px;
    border:1px solid rgba(236,230,217,0.18);
    background:rgba(12,13,14,0.45);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    font-family:var(--ff-mono);
    font-size:0.65rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--bone-dim);
    transition:color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .hero-back:hover{
    color:var(--gold);
    border-color:rgba(201,162,39,0.45);
    background:rgba(12,13,14,0.65);
  }
  .hero-back svg{width:14px;height:14px;flex-shrink:0;}
  @media (max-width:640px){
    .hero-back span{display:none;}
    .hero-back{padding:0.55rem;}
  }

  /* ---------- HERO — full-bleed cover image, taller / larger than a
     typical social cover photo, with the title overlaid bottom-left ---------- */
  #detail-hero{
    position:relative;
    height:clamp(480px, 66vw, 740px);
    min-height:68vh;
    width:100%;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
  }
  #detail-hero .hero-bg{
    position:absolute;inset:0;
    background-size:cover;
    background-position:center;
  }
  /* Soft black abstract shadow forms blended into the yellow base below
     (set inline via HERO_BG in the script). mix-blend-mode:multiply means
     these are pure alpha-fades with no hard edges, so they read as
     shadow/depth sitting IN the yellow surface rather than separate
     shapes stacked on top of it. Same layer on every project, so every
     title header shares the same treatment. No white lines/icons here
     anymore — this replaces that old layer entirely. */
  #detail-hero .hero-bg::before{
    content:'';
    position:absolute;inset:0;
    background-image:
      radial-gradient(ellipse 50% 54% at 86% 8%, rgba(8,7,3,0.56) 0%, rgba(8,7,3,0.28) 38%, transparent 72%),
      radial-gradient(ellipse 54% 60% at 6% 88%, rgba(6,5,2,0.64) 0%, rgba(6,5,2,0.34) 40%, transparent 76%),
      radial-gradient(ellipse 58% 44% at 52% 62%, rgba(10,8,3,0.32) 0%, transparent 70%),
      radial-gradient(ellipse 40% 34% at 26% 18%, rgba(8,7,3,0.24) 0%, transparent 68%),
      radial-gradient(ellipse 40% 36% at 98% 58%, rgba(8,7,3,0.22) 0%, transparent 70%),
      radial-gradient(ellipse 36% 32% at 60% 92%, rgba(6,5,2,0.4) 0%, transparent 70%),
      linear-gradient(0deg, rgba(4,3,1,0.9) 0%, rgba(4,3,1,0.66) 20%, rgba(4,3,1,0.32) 42%, rgba(4,3,1,0.1) 62%, transparent 80%);
    mix-blend-mode:multiply;
  }
  /* Heavier, more visible grain — still clean/premium rather than a flat
     noisy layer, achieved by stacking two feTurbulence passes at
     different scales so the texture reads as fine detail, not mush.
     The overlay blend also breaks up the shadow shapes above into a
     slightly organic, non-solid texture instead of flat silhouettes.
     Pure SVG feTurbulence, generated in code, not a reference image. */
  #detail-hero .hero-bg::after{
    content:'';
    position:absolute;inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><filter id='n2'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n2)'/></svg>");
    background-repeat:repeat;
    mix-blend-mode:overlay;
    opacity:0.4;
    pointer-events:none;
  }
  #detail-hero .hero-scrim{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(12,13,14,0.05) 0%, rgba(12,13,14,0.15) 40%, rgba(12,13,14,0.92) 100%),
               linear-gradient(90deg, rgba(12,13,14,0.55) 0%, rgba(12,13,14,0.05) 55%);
  }
  .hero-detail-content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:80rem;
    margin:0 auto;
    padding:0 clamp(1.2rem,4vw,3rem) clamp(2.4rem,5vw,3.6rem);
  }
  .hero-detail-title{
    font-family:var(--ff-display);
    font-weight:700;
    font-size:clamp(3.1rem, 8.2vw, 6.6rem);
    line-height:0.95;
    letter-spacing:0.01em;
    max-width:20ch;
    color:var(--bone);
    text-shadow:0 2px 24px rgba(0,0,0,0.35);
  }
  .hero-detail-tags{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:0.55rem;
    margin-top:1.1rem;
  }
  .hero-detail-tag{
    display:inline-flex;
    align-items:center;
    padding:0.5rem 1.1rem;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:999px;
    background:rgba(74,74,74,0.65);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    font-family:var(--ff-mono);
    font-size:0.7rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:#ffffff;
  }

  /* meta-bar removed — hero now shows only the project title */

  /* ---------- CASE STUDY BODY ---------- */
  .case-wrap{
    max-width:80rem;
    margin:0 auto;
    padding:clamp(1.2rem,4vw,3rem);
  }
  .case-section{
    padding:clamp(3rem,7vw,5rem) 0;
    border-bottom:1px solid var(--line);
  }
  .case-section:last-of-type{border-bottom:none;}
  .case-head{
    margin-bottom:1.8rem;
  }
  .case-head .eyebrow{
    display:block;
  }
  .case-head h2{
    font-family:var(--ff-display);
    font-size:clamp(1.7rem,3.2vw,2.6rem);
    letter-spacing:0.01em;
    margin-top:0.7rem;
  }
  .eyebrow{
    font-family:var(--ff-mono);
    font-size:0.7rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--gold);
  }
  /* Overview and Gallery headings stand alone (no separate h2 below
     them), so they get the same big, white, display-font treatment as
     every other section's h2 instead of looking like a small gold label. */
  .case-head.solo .eyebrow{
    font-family:var(--ff-display);
    font-weight:700;
    font-size:clamp(1.7rem,3.2vw,2.6rem);
    letter-spacing:0.01em;
    text-transform:uppercase;
    color:var(--bone);
  }
  .head-dash{
    display:inline-block;
    font-family:var(--ff-body);
    font-weight:300;
    color:var(--dash-yellow);
    opacity:0.75;
    margin-right:0.35em;
    transform:scaleY(0.55);
    transform-origin:center;
  }
  .case-copy p{
    font-weight:300;
    font-size:clamp(0.95rem,1.3vw,1.08rem);
    line-height:1.75;
    color:var(--bone-dim);
    max-width:70ch;
  }
  .case-copy p + p{margin-top:1.1rem;}

  /* ---------- PROJECT GALLERY — large center image, side arrows, dot
     indicators; behaves like a classic photo-viewer carousel ---------- */
  .gallery{
    position:relative;
    margin-top:2.4rem;
  }
  .gallery-viewport{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--ink);
  }
  .gallery-track{
    display:flex;
    height:100%;
    width:100%;
    transition:transform 0.55s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .gallery-slide{
    position:relative;
    flex:0 0 100%;
    height:100%;
    display:flex;
    align-items:flex-end;
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }
  .gallery-slide::before{
    content:'';
    position:absolute;inset:0;
    background-image:repeating-linear-gradient(115deg, rgba(236,230,217,0.05) 0px, rgba(236,230,217,0.05) 1px, transparent 1px, transparent 34px);
    opacity:0.5;
  }
  .gallery-slide::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(12,13,14,0.75) 100%);
  }
  .gallery-slide-label{
    position:relative;
    z-index:2;
    padding:1.4rem clamp(1.2rem,3vw,2rem);
    font-family:var(--ff-mono);
    font-size:0.75rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--bone);
  }
  .gallery-slide-index{
    position:absolute;
    z-index:1;
    right:1.6rem;
    top:1.2rem;
    font-family:var(--ff-display);
    font-size:clamp(2.4rem,6vw,4.4rem);
    color:transparent;
    -webkit-text-stroke:1.5px rgba(236,230,217,0.28);
  }
  .gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(12,13,14,0.55);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--bone);
    transition:border-color 0.25s ease, background 0.25s ease, opacity 0.25s ease;
    z-index:3;
  }
  .gallery-arrow:hover{border-color:var(--gold);background:rgba(12,13,14,0.8);}
  .gallery-arrow:disabled{opacity:0.3;cursor:default;}
  .gallery-arrow:disabled:hover{border-color:var(--line);}
  .gallery-prev{left:1rem;}
  .gallery-next{right:1rem;}
  .gallery-arrow svg{width:18px;height:18px;}
  .gallery-fullscreen{
    position:absolute;
    right:1rem;
    bottom:1rem;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(12,13,14,0.55);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--bone);
    transition:border-color 0.25s ease, background 0.25s ease;
    z-index:3;
  }
  .gallery-fullscreen:hover{border-color:var(--gold);background:rgba(12,13,14,0.8);}
  .gallery-fullscreen svg{width:17px;height:17px;}
  .gallery-fullscreen .icon-exit{display:none;}
  .gallery-viewport:fullscreen{
    aspect-ratio:auto;
    width:100vw;
    height:100vh;
    border-radius:0;
    background:var(--ink);
  }
  .gallery-viewport:fullscreen .gallery-fullscreen .icon-enter{display:none;}
  .gallery-viewport:fullscreen .gallery-fullscreen .icon-exit{display:block;}
  .gallery-viewport:-webkit-full-screen{
    aspect-ratio:auto;
    width:100vw;
    height:100vh;
    border-radius:0;
    background:var(--ink);
  }
  .gallery-viewport:-webkit-full-screen .gallery-fullscreen .icon-enter{display:none;}
  .gallery-viewport:-webkit-full-screen .gallery-fullscreen .icon-exit{display:block;}

  .gallery-dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0.6rem;
    margin-top:1.2rem;
  }
  .gallery-dot{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--line);
    border:none;
    padding:0;
    cursor:pointer;
    transition:background 0.25s ease, transform 0.25s ease;
  }
  .gallery-dot.active{
    background:var(--gold);
    transform:scale(1.25);
  }

  @media (max-width:640px){
    .gallery-arrow{width:36px;height:36px;}
    .gallery-fullscreen{width:34px;height:34px;right:0.7rem;bottom:0.7rem;}
  }

  /* ---------- PROCESS STEPS ---------- */
  .steps-list{
    display:flex;
    flex-direction:column;
    margin-top:1.6rem;
  }
  .step-item{
    display:grid;
    grid-template-columns:56px 1fr;
    gap:1.4rem;
    padding:1.4rem 0;
    border-top:1px solid var(--line);
  }
  .step-item:last-child{border-bottom:1px solid var(--line);}
  .step-num{
    font-family:var(--ff-display);
    font-size:1.6rem;
    color:transparent;

  var ORDER = ['smartserve-ai-agent','fitness-gym-automation','leadtrack-crm','healthfacts-content-automation','courseflow-enrollment'];

  // Maps a stack item's display name to an official brand icon slug on
  // simple-icons' CDN, rendered in the brand's own original colors
  // (no color override passed to the CDN). Generic, non-branded terms
  // that have no real logo fall back to a small gold-accented glyph
  // rather than a flat monochrome icon, so they still read as
  // intentional rather than missing.
  var STACK_ICON_SLUGS = {
    'n8n':'n8n',
    'Google Sheets':'googlesheets',
    'Google Gemini':'googlegemini',
    'OpenAI':'openai',
    'Gmail':'gmail',
    'Facebook Messenger':'messenger',
    'Google Docs':'googledocs',
    'Facebook':'facebook',
    'Zapier':'zapier',
    'HubSpot':'hubspot',
    'Slack':'slack',
    'Jotform':'jotform',
    'Brevo':'brevo'
  };

  function genericStackIcon(){

    return '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:var(--gold)">' +
      '<circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.4"/>' +
      '<path d="M12 3v3.4M12 17.6V21M21 12h-3.4M6.4 12H3M18.36 5.64l-2.4 2.4M8.04 15.96l-2.4 2.4M18.36 18.36l-2.4-2.4M8.04 8.04l-2.4-2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
      '</svg>';
  }

  // If a brand logo ever fails to fetch from the CDN (network hiccup,
  // slug mismatch, etc.), swap it for the generic glyph instead of
  // leaving a broken-image icon in the card.
  window.__stackLogoFallback = function(imgEl){
    imgEl.parentNode.innerHTML = genericStackIcon();
  };

  function esc(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---- Slug resolution ----
  // Primary source of truth is now the URL PATH: /project/<slug>.
  // (A bare visit to Projects.html with no slug, or an old #slug link,
  // still resolves via the fallbacks below instead of breaking.)
  function getSlugFromPath(){
    var parts = window.location.pathname.split('/').filter(Boolean);
    var idx = parts.indexOf('project');
    if(idx !== -1 && parts[idx + 1]){ return decodeURIComponent(parts[idx + 1]); }
    if(window.location.hash){ return window.location.hash.replace('#',''); }
    return '';
  }

  function render(slug){
    var p = PROJECTS[slug] ? slug : ORDER[0];
    var data = PROJECTS[p];

    document.title = data.title + ' — Maveric Viernes';
    document.getElementById('heroBg').style.backgroundImage = HERO_BG;
    document.getElementById('heroTitle').textContent = data.title;
    document.getElementById('heroTag').innerHTML = data.tag.map(function(t){
      return '<span class="hero-detail-tag">'+esc(t)+'</span>';
    }).join('');

    document.getElementById('overviewCopy').innerHTML = data.overview.map(function(t){return '<p>'+esc(t)+'</p>';}).join('');
    document.getElementById('challengeCopy').innerHTML = data.challenge.map(function(t){return '<p>'+esc(t)+'</p>';}).join('');
    document.getElementById('solutionCopy').innerHTML = data.solution.map(function(t){return '<p>'+esc(t)+'</p>';}).join('');

    document.getElementById('stepsList').innerHTML = data.steps.map(function(s, i){
      return '<div class="step-item"><span class="step-num">'+String(i+1).padStart(2,'0')+'</span><div class="step-body"><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div></div>';
    }).join('');

    document.getElementById('statGrid').innerHTML = data.results.map(function(r){
      return '<div class="stat"><div class="num">'+esc(r.n)+'</div><div class="label">'+esc(r.l)+'</div></div>';
    }).join('');

    document.getElementById('stackRow').innerHTML = data.stack.map(function(s){
      var slug = STACK_ICON_SLUGS[s];
      var inner = slug
        ? '<img src="https://cdn.simpleicons.org/'+slug+'" alt="'+esc(s)+'" onerror="window.__stackLogoFallback(this)">'
        : genericStackIcon();
      return '<div class="stack-card">' +
               '<span class="stack-card-logo" role="img" aria-label="'+esc(s)+'">'+inner+'</span>' +
               '<span class="stack-card-name">'+esc(s)+'</span>' +
             '</div>';
    }).join('');

    // ---- Previous / Next project navigation. With a circular ORDER
    // list of 2+ projects there's always a neighbor in each direction;
    // if only a single project exists, both controls disable gracefully
    // instead of linking back to the current page. ----
    var prevBtn = document.getElementById('prevProject');
    var nextBtn = document.getElementById('nextProject');
    var hasNeighbors = ORDER.length > 1;

    if(hasNeighbors){
      var prevSlug = ORDER[(data.order - 1 + ORDER.length) % ORDER.length];
      var nextSlug = ORDER[(data.order + 1) % ORDER.length];
      prevBtn.href = '/project/' + prevSlug;
      nextBtn.href = '/project/' + nextSlug;
      document.getElementById('prevTitle').textContent = PROJECTS[prevSlug].title;
      document.getElementById('nextTitle').textContent = PROJECTS[nextSlug].title;
      prevBtn.classList.remove('disabled');
      nextBtn.classList.remove('disabled');
      prevBtn.removeAttribute('aria-disabled');
      nextBtn.removeAttribute('aria-disabled');
    } else {
      // Only one project total — nothing to navigate to either side.
      [prevBtn, nextBtn].forEach(function(btn){
        btn.classList.add('disabled');
        btn.setAttribute('aria-disabled','true');
        btn.removeAttribute('href');
      });
      document.getElementById('prevTitle').textContent = '—';
      document.getElementById('nextTitle').textContent = '—';
    }

    initGallery(GALLERY[p] || []);

    if(window.__resetScroll){ window.__resetScroll(); } else { window.scrollTo(0, 0); }
  }

  // ---- Project gallery — large center image, side arrows, dot
  // indicators, smooth eased transitions; basic keyboard and swipe
  // support, like a classic photo-viewer carousel. ----
  var galleryTrack = document.getElementById('galleryTrack');
  var galleryDots = document.getElementById('galleryDots');
  var galleryPrev = document.getElementById('galleryPrev');
  var galleryNext = document.getElementById('galleryNext');
  var galleryIndex = 0;
  var galleryLen = 0;

  function initGallery(slides){
    galleryLen = slides.length;
    galleryIndex = 0;

    galleryTrack.innerHTML = slides.map(function(s, i){
      return '<div class="gallery-slide" style="background-image:'+s.bg+'">' +
               '<span class="gallery-slide-index">'+String(i+1).padStart(2,'0')+'</span>' +
               '<span class="gallery-slide-label">'+esc(s.label)+'</span>' +
             '</div>';
    }).join('');

    galleryDots.innerHTML = slides.map(function(_, i){
      return '<button class="gallery-dot" data-i="'+i+'" aria-label="Go to image '+(i+1)+'"></button>';
    }).join('');

    updateGallery(true);
  }

  function updateGallery(instant){
    galleryTrack.style.transition = instant ? 'none' : '';
    galleryTrack.style.transform = 'translateX(-' + (galleryIndex * 100) + '%)';
    if(instant){ galleryTrack.offsetHeight; galleryTrack.style.transition = ''; }

    var dots = galleryDots.querySelectorAll('.gallery-dot');
    dots.forEach(function(d, i){ d.classList.toggle('active', i === galleryIndex); });

    galleryPrev.disabled = galleryIndex === 0;
    galleryNext.disabled = galleryIndex >= galleryLen - 1;
  }

  function galleryGo(i){
    galleryIndex = Math.max(0, Math.min(galleryLen - 1, i));
    updateGallery(false);
  }

  galleryPrev.addEventListener('click', function(){ galleryGo(galleryIndex - 1); });
  galleryNext.addEventListener('click', function(){ galleryGo(galleryIndex + 1); });

  // ---- Fullscreen toggle for the gallery viewport ----
  (function initGalleryFullscreen(){
    var fsBtn = document.getElementById('galleryFullscreen');
    var viewport = document.querySelector('.gallery-viewport');
    if(!fsBtn || !viewport) return;

    function isFullscreen(){
      return document.fullscreenElement === viewport || document.webkitFullscreenElement === viewport;
    }
    function requestFs(el){
      if(el.requestFullscreen){ return el.requestFullscreen(); }
      if(el.webkitRequestFullscreen){ return el.webkitRequestFullscreen(); }
    }
    function exitFs(){
      if(document.exitFullscreen){ return document.exitFullscreen(); }
      if(document.webkitExitFullscreen){ return document.webkitExitFullscreen(); }
    }
    fsBtn.addEventListener('click', function(){
      if(isFullscreen()){ exitFs(); } else { requestFs(viewport); }
    });
    fsBtn.setAttribute('aria-label', 'View gallery fullscreen');
    document.addEventListener('fullscreenchange', function(){
      fsBtn.setAttribute('aria-label', isFullscreen() ? 'Exit fullscreen' : 'View gallery fullscreen');
    });
    document.addEventListener('webkitfullscreenchange', function(){
      fsBtn.setAttribute('aria-label', isFullscreen() ? 'Exit fullscreen' : 'View gallery fullscreen');
    });
  })();
  galleryDots.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.gallery-dot') : null;
    if(!btn) return;
    galleryGo(parseInt(btn.getAttribute('data-i'), 10));
  });

  document.getElementById('gallery').addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft'){ galleryGo(galleryIndex - 1); }
    if(e.key === 'ArrowRight'){ galleryGo(galleryIndex + 1); }
  });

  (function initGallerySwipe(){
    var startX = null;
    var viewport = document.querySelector('.gallery-viewport');
    viewport.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
    }, {passive:true});
    viewport.addEventListener('touchend', function(e){
      if(startX === null) return;
      var endX = e.changedTouches[0].clientX;
      var delta = startX - endX;
      startX = null;
      if(Math.abs(delta) < 40) return;
      galleryGo(galleryIndex + (delta > 0 ? 1 : -1));
    }, {passive:true});
  })();

  render(getSlugFromPath());

  // Switching project via a same-page control (prev/next) updates the
  // address bar to the real /project/<slug> URL with pushState and
  // re-renders in place — no full reload, same fade transition as
  // before. A normal browser navigation (typed URL, refresh, external
  // link, or a modified click) still works via the server rewrite that
  // routes /project/* to this file.
  function goToSlug(slug){
    var overlay = document.getElementById('page-transition');
    history.pushState(null, '', '/project/' + slug);
    overlay.classList.remove('cleared');
    overlay.style.transition = 'none';
    overlay.offsetHeight; // force reflow so the instant show applies
    overlay.style.transition = '';
    render(slug);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ overlay.classList.add('cleared'); });
    });
  }

  [document.getElementById('prevProject'), document.getElementById('nextProject')].forEach(function(btn){
    btn.addEventListener('click', function(e){
      if(btn.classList.contains('disabled')) return;
      if(e.metaKey || e.ctrlKey || e.shiftKey || btn.target === '_blank') return;
      var href = btn.getAttribute('href');
      if(!href) return;
      var slug = href.split('/').filter(Boolean).pop();
      e.preventDefault();
      goToSlug(slug);
    });
  });

  // Browser Back/Forward between two /project/<slug> URLs
  window.addEventListener('popstate', function(){
    var overlay = document.getElementById('page-transition');
    overlay.classList.remove('cleared');
    overlay.style.transition = 'none';
    overlay.offsetHeight;
    overlay.style.transition = '';
    render(getSlugFromPath());
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ overlay.classList.add('cleared'); });
    });
  });

  // Reveal the page (fade the ink overlay out) just after content is
  // painted — the counterpart to the homepage fading the same overlay
  // IN before sending the browser here, so the two motions read as one.
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.getElementById('page-transition').classList.add('cleared');
    });
  });
})();
</script>
<script>
  // ---- Mobile hamburger menu (Services/Projects/Contact live here on
  // mobile only; desktop nav-links are untouched) ----
  (function initMobileMenu(){
    var btn = document.getElementById('navHamburger');
    var menu = document.getElementById('mobileMenu');
    if(!btn || !menu) return;
    btn.addEventListener('click', function(){
      var isOpen = menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    menu.addEventListener('click', function(e){
      if(e.target.closest('a')){
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
    window.addEventListener('resize', function(){
      if(window.innerWidth > 768 && menu.classList.contains('open')){
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
<script>
  // ---- Light / dark mode toggle (copied from Untitled-2) ----
  (function initThemeToggle(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    var root = document.documentElement;
    btn.addEventListener('click', function(){
      var isLight = root.getAttribute('data-theme') === 'light';
      if(isLight){
        root.removeAttribute('data-theme');
        try{ localStorage.setItem('mtv-theme','dark'); }catch(e){}
      } else {
        root.setAttribute('data-theme','light');
        try{ localStorage.setItem('mtv-theme','light'); }catch(e){}
      }
    });
  })();
</script>
